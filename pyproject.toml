[project]
name = "gerenet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "hvac>=2.2",
    "jinja2>=3.1.6",
    "markdown>=3.6",
    "netmiko>=4.3",
    "nh3>=0.2.17",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "textfsm>=1.1.3",
    "typer>=0.12",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gerenet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
gerenet = "gerenet.cli.main:app"
gerenet-worker = "gerenet.worker.tasks:worker_main"
