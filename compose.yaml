# Dev completo: infra (db/redis/vault) + app (api/worker) + frontend (web).
# `docker compose up -d --build` sobe tudo; ver README.
x-app-env: &app-env
  GERENET_DATABASE_URL: postgresql+psycopg://gerenet:gerenet@db:5432/gerenet
  GERENET_REDIS_URL: redis://redis:6379/0
  GERENET_VAULT_URL: http://vault:8200
  GERENET_VAULT_TOKEN: gerenet-dev-root
  GERENET_API_KEY: trocar-em-producao

services:
  db:
    image: postgres:16-alpine
    container_name: gerenet-db
    environment:
      POSTGRES_USER: gerenet
      POSTGRES_PASSWORD: gerenet
      POSTGRES_DB: gerenet
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerenet"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gerenet-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  vault:
    image: hashicorp/vault:1.17
    container_name: gerenet-vault
    # O dev server do Vault é in-memory: qualquer restart apaga os segredos.
    # O entrypoint re-grava a credencial da automação a partir do `.env`
    # (gitignored) — preencha GERENET_VAULT_USERNAME/GERENET_VAULT_PASSWORD
    # (veja .env.example). Sem senha configurada, o segredo é deixado vazio.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: gerenet-dev-root
      GERENET_VAULT_USERNAME: ${GERENET_VAULT_USERNAME:-gerenet-auto}
      GERENET_VAULT_PASSWORD: ${GERENET_VAULT_PASSWORD:-}
      # sem isso o dev server escuta em 127.0.0.1 dentro do container e o
      # publish 8200:8200 fica inalcançável do host (tests/test_secrets.py).
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command:
      - /bin/sh
      - -c
      - >-
        vault server -dev -dev-root-token-id=gerenet-dev-root &
        until VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=gerenet-dev-root vault status >/dev/null 2>&1; do sleep 1; done;
        if [ -n "$GERENET_VAULT_PASSWORD" ]; then
        VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=gerenet-dev-root vault kv put secret/gerenet/credential-groups/automacao username="$GERENET_VAULT_USERNAME" password="$GERENET_VAULT_PASSWORD";
        fi;
        wait
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gerenet-api
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    ports: ["8000:8000"]
    volumes:
      - ./src:/srv/app/src
      - ./alembic:/srv/app/alembic
      - ./alembic.ini:/srv/app/alembic.ini
      - ./tests:/srv/app/tests
      # Páginas do wiki operacional (ciclo E) — o código usa docs/wiki relativo
      # ao CWD (/srv/app); sem o mount, o índice vem vazio e toda página 404.
      - ./docs:/srv/app/docs:ro
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gerenet-worker
    # Migrações só no api (evita corrida de alembic em banco novo)
    command: ["uv", "run", "gerenet-worker"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./src:/srv/app/src
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started

  web:
    image: node:22-alpine
    container_name: gerenet-web
    working_dir: /srv/web
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./web:/srv/web
      - node_modules:/srv/web/node_modules
    depends_on:
      - api

  # Observabilidade de dev (§20): raspa o /metrics da API e abre o dashboard
  # provisionado. Em produção, o Prometheus/Grafana são os de quem instala.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gerenet-prometheus
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gerenet-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      - prometheus

volumes:
  db-data:
  node_modules:
  uv-cache:
